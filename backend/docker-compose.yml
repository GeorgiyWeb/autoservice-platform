services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: autoservice_db
      POSTGRES_USER: autoservice_user
      POSTGRES_PASSWORD: autoservice_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://autoservice_user:autoservice_password@db:5432/autoservice_db

volumes:
  postgres_data: